[package]
name = "dispatch"
version = "0.2.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { path = "../..", features = ["assert_process_allocs"] }
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0"
nih_plug_webview = { path = "../../nih-plug-webview" }
ureq = "2.10.1"
base64 = "0.22.1"
directories = "6.0.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }
