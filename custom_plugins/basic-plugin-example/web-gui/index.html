<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Plugin Example</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f1ea;
        --panel: #ffffff;
        --text: #1a1a18;
        --accent: #e07a3f;
        --accent-dark: #b85d2b;
        --muted: #9a9389;
        --meter-bg: #efe6dc;
        --meter-fill: #2f5d50;
        --meter-fill-hot: #d74841;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Avenir Next", "Gill Sans", "Trebuchet MS", sans-serif;
        background: radial-gradient(circle at top, #fff7ed 0%, var(--bg) 55%, #ece1d6 100%);
        color: var(--text);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .panel {
        width: min(520px, 100%);
        background: var(--panel);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 18px 40px rgba(35, 30, 25, 0.18);
        border: 1px solid #e3d7cb;
        display: grid;
        gap: 18px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }

      h1 {
        font-size: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .subtitle {
        font-size: 12px;
        color: var(--muted);
      }

      .controls {
        display: grid;
        gap: 16px;
      }

      .control {
        display: grid;
        grid-template-columns: 120px 1fr 90px;
        align-items: center;
        gap: 12px;
      }

      .control label {
        font-weight: 600;
        font-size: 13px;
        color: #3a332c;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .value {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent-dark);
        text-align: right;
      }

      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent) 0%, #f3c7a8 100%);
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent-dark);
        border: 2px solid #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        cursor: grab;
      }

      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent-dark);
        border: 2px solid #ffffff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        cursor: grab;
      }

      input[type="range"]::-moz-range-track {
        height: 8px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent) 0%, #f3c7a8 100%);
      }

      .meters {
        display: grid;
        gap: 14px;
      }

      .meter-group {
        display: grid;
        gap: 6px;
      }

      .meter-label {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .meter-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .meter {
        position: relative;
        height: 64px;
        background: var(--meter-bg);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #e1d3c5;
      }

      .meter span {
        position: absolute;
        top: 6px;
        left: 8px;
        font-size: 11px;
        color: var(--muted);
        z-index: 1;
      }

      .meter-fill {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 100%;
        transform-origin: bottom;
        transform: scaleY(0);
        background: linear-gradient(180deg, var(--meter-fill-hot), var(--meter-fill));
        transition: transform 0.08s linear;
      }

      .footer {
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <header>
        <h1>Basic Plugin Example</h1>
        <div class="subtitle">Saturation + Gain</div>
      </header>

      <section class="controls">
        <div class="control">
          <label for="saturation">Saturation</label>
          <input id="saturation" type="range" min="0" max="10" step="0.01" value="1" />
          <div class="value" id="saturation-value">1.00x</div>
        </div>
        <div class="control">
          <label for="gain">Gain</label>
          <input id="gain" type="range" min="-24" max="24" step="0.1" value="0" />
          <div class="value" id="gain-value">0.0 dB</div>
        </div>
      </section>

      <section class="meters">
        <div class="meter-group">
          <div class="meter-label">Input Level</div>
          <div class="meter-row">
            <div class="meter">
              <span>L</span>
              <div class="meter-fill" id="meter-in-l"></div>
            </div>
            <div class="meter">
              <span>R</span>
              <div class="meter-fill" id="meter-in-r"></div>
            </div>
          </div>
        </div>
        <div class="meter-group">
          <div class="meter-label">Output Level</div>
          <div class="meter-row">
            <div class="meter">
              <span>L</span>
              <div class="meter-fill" id="meter-out-l"></div>
            </div>
            <div class="meter">
              <span>R</span>
              <div class="meter-fill" id="meter-out-r"></div>
            </div>
          </div>
        </div>
      </section>

      <div class="footer" id="status">Waiting for plugin...</div>
    </div>

    <script>
      const saturationSlider = document.getElementById("saturation");
      const gainSlider = document.getElementById("gain");
      const saturationValue = document.getElementById("saturation-value");
      const gainValue = document.getElementById("gain-value");
      const status = document.getElementById("status");

      const meterInL = document.getElementById("meter-in-l");
      const meterInR = document.getElementById("meter-in-r");
      const meterOutL = document.getElementById("meter-out-l");
      const meterOutR = document.getElementById("meter-out-r");

      const sendToPluginSafe = (payload) => {
        if (typeof window.sendToPlugin === "function") {
          window.sendToPlugin(payload);
        } else {
          console.log("sendToPlugin missing", payload);
        }
      };

      const setSaturationDisplay = (value) => {
        const clamped = Math.max(0, Math.min(10, value));
        saturationSlider.value = clamped.toFixed(2);
        saturationValue.textContent = `${clamped.toFixed(2)}x`;
      };

      const setGainDisplay = (value) => {
        const clamped = Math.max(-24, Math.min(24, value));
        gainSlider.value = clamped.toFixed(1);
        gainValue.textContent = `${clamped.toFixed(1)} dB`;
      };

      const setMeter = (element, value) => {
        const clamped = Math.max(0, Math.min(1, value));
        element.style.transform = `scaleY(${clamped})`;
      };

      saturationSlider.addEventListener("input", () => {
        const value = Number(saturationSlider.value);
        setSaturationDisplay(value);
        sendToPluginSafe({ type: "SetSaturation", value });
      });

      gainSlider.addEventListener("input", () => {
        const value = Number(gainSlider.value);
        setGainDisplay(value);
        sendToPluginSafe({ type: "SetGain", value });
      });

      window.onPluginMessage = (msg) => {
        if (msg.type === "ParamChange") {
          if (typeof msg.saturation === "number") {
            setSaturationDisplay(msg.saturation);
          }
          if (typeof msg.gain === "number") {
            setGainDisplay(msg.gain);
          }
          status.textContent = "Connected";
        }

        if (msg.type === "Meter") {
          setMeter(meterInL, msg.input?.l ?? 0);
          setMeter(meterInR, msg.input?.r ?? 0);
          setMeter(meterOutL, msg.output?.l ?? 0);
          setMeter(meterOutR, msg.output?.r ?? 0);
        }
      };

      sendToPluginSafe({ type: "Init" });
    </script>
  </body>
</html>
