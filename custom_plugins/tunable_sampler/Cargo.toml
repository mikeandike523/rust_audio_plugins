[package]
name = "tunable_sampler"
version = "0.0.12"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { path = "../..", features = ["assert_process_allocs"] }
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0"
nih_plug_webview = { path = "../../nih-plug-webview" }
ureq = "2.10.1"
tinyfiledialogs = "3.9.1"
base64 = "0.22.1"
directories = "6.0.0"
pitch-detection = "0.3.0"
rubato = "0.15"
tune = "0.34.0"
